    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      // theme before first paint (no flash): saved choice, or the OS setting on "system"
      (function () {
        var t = 'dark'
        try { t = JSON.parse(localStorage.getItem('opinion:theme') || '"dark"') } catch (e) {}
        if (t === 'system') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
      })()
    </script>
    <title>OPINION</title>
    <meta name="description" content="Share your own, help world, make friends, get rewarded" />
    <!-- link previews (WhatsApp, Telegram, iMessage, Slack, Discord, Facebook, X) -->

    <meta property="og:title" content="OPINION" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot guard: plain ES5 so it runs even if the app bundle can't parse (old iOS). Shows WHY instead of a blank page. -->
    <script>
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) {
          errs.push((e.message || 'Script error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { errs.push('Promise: ' + String(e.reason).slice(0, 300)); });
        function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
        window.__opinionFatal = function (title, extra) {
          if (document.getElementById('boot-guard')) return;
          if (extra) errs.unshift(extra);
          var gl = 'NO';
          try { gl = document.createElement('canvas').getContext('webgl2') ? 'yes' : 'NO'; } catch (x) {}
          var lines = errs.slice(0, 6).concat(['WebGL2: ' + gl, 'Screen: ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio + 'x', navigator.userAgent]);
          var el = document.createElement('div');
          el.id = 'boot-guard';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#000;color:#fff;font:14px/1.5 -apple-system,system-ui,sans-serif;padding:28px 22px;overflow:auto';
          el.innerHTML = '<div style="font-weight:700;font-size:22px">OPINI<span style="color:#14f195">ON</span></div>' +
            '<p style="margin:14px 0 6px;font-weight:600">' + esc(title) + '</p>' +
            '<p style="color:#9a9aa5;margin:0 0 14px">Screenshot this and send it to the developer.</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#0d0d10;border:1px solid #222;border-radius:12px;padding:12px;font-size:12px;color:#d6d6de">' + esc(lines.join('\n\n')) + '</pre>' +
            '<button onclick="location.reload()" style="margin-top:14px;padding:10px 16px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font:inherit">Reload</button>';
          document.body.appendChild(el);
        };
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) window.__opinionFatal("The app couldn't start on this device.");
        }, 9000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
